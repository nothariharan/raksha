services:
  - type: web
    name: raksha-protocol
    runtime: node
    plan: free
    region: singapore
    branch: chore/production-deployment
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: REAL_GOVERNMENT_INTEGRATION
        value: "false"
      - key: FORCE_FILE_DB
        value: "false"
      - key: PROTOCOL_PUBLIC_ORIGIN
        value: https://raksha-protocol.onrender.com
      - key: TWILIO_WEBHOOK_URL
        value: https://raksha-protocol.onrender.com/whatsapp/webhook
      - key: TWILIO_VALIDATE_SIGNATURE
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: raksha-postgres
          property: connectionString

databases:
  - name: raksha-postgres
    plan: free
    region: singapore
    databaseName: raksha
    user: raksha
