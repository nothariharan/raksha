services:
  - type: web
    name: raksha-protocol
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: REAL_GOVERNMENT_INTEGRATION
        value: "false"
      - key: FORCE_FILE_DB
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: raksha-postgres
          property: connectionString

databases:
  - name: raksha-postgres
    plan: free
    region: oregon
    databaseName: raksha
    user: raksha
