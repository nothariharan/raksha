name: Keep protocol warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render protocol host
        run: curl -fsS --retry 3 --retry-delay 8 --max-time 90 https://raksha-protocol.onrender.com/health
